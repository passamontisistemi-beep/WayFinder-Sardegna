<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>WayFinder Sardegna</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
body { margin:0; font-family:Arial; }

/* SCREEN */
.screen { display:none; }
.active { display:flex; }

/* START */
#start {
  height:100vh;
  justify-content:center;
  align-items:center;
}

#start button {
  padding:20px;
  font-size:20px;
  background:black;
  color:white;
  border:none;
  border-radius:10px;
}

/* RAGGIO */
#raggioScreen {
  height:100vh;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}

#slider { width:80%; }

/* APP */
#app {
  flex-direction:column;
}

/* HEADER */
#header img {
  width:100%;
  height:70px;
  object-fit:cover;
}

/* INFO */
#info {
  text-align:center;
  font-weight:bold;
  padding:5px;
}

/* MAP */
#map {
  height:50vh;
}

/* RSS */
#rss {
  background:black;
  color:white;
  font-weight:bold;
}

.marquee {
  overflow:hidden;
  white-space:nowrap;
}

.marquee div {
  display:inline-block;
  padding-left:100%;
  animation:scroll 15s linear infinite;
}

@keyframes scroll {
  0% { transform:translateX(0); }
  100% { transform:translateX(-100%); }
}
</style>
</head>

<body>

<!-- START -->
<div id="start" class="screen active">
  <button onclick="startGPS()">WayFinder</button>
</div>

<!-- RAGGIO -->
<div id="raggioScreen" class="screen">
  <h2>Seleziona raggio</h2>
  <input type="range" id="slider" min="1" max="50" value="10">
  <div id="valore">10 km</div>
  <button onclick="entraApp()">Conferma</button>
</div>

<!-- APP -->
<div id="app" class="screen">

<div id="header">
  <img src="header-wayfinder.png">
</div>

<div id="info">
I punti di interesse mappati sono quelli presenti in un raggio di <span id="raggioTxt"></span> km
</div>

<div id="rss">
<div class="marquee"><div>EVENTI ISTITUZIONALI</div></div>
<div class="marquee"><div>📞 112 INFOPOINT</div></div>
</div>

<div id="map"></div>

</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

let userLat, userLon;
let raggio = 10;
let map;

// SLIDER
document.getElementById("slider").oninput = function(){
raggio = this.value;
document.getElementById("valore").innerText = raggio + " km";
};

// START GPS
function startGPS(){

navigator.geolocation.getCurrentPosition(
(pos)=>{
userLat = pos.coords.latitude;
userLon = pos.coords.longitude;

// cambia schermata
document.getElementById("start").classList.remove("active");
document.getElementById("raggioScreen").classList.add("active");
},
()=>{
alert("GPS non autorizzato");
}
);

}

// ENTRA APP
function entraApp(){

document.getElementById("raggioScreen").classList.remove("active");
document.getElementById("app").classList.add("active");

document.getElementById("raggioTxt").innerText = raggio;

// FIX LEAFLET
setTimeout(()=>{
initMap();
},200);

}

// MAP
function initMap(){

map = L.map('map',{dragging:false}).setView([userLat,userLon],10);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

// TU SEI QUI
L.circleMarker([userLat,userLon],{
radius:12,
fillColor:"red",
color:"white",
weight:3,
fillOpacity:1
}).addTo(map).bindPopup("Tu sei qui").openPopup();

}

</script>

</body>
</html>
