<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>WayFinder Sardegna</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
body {
    margin:0;
    font-family: Arial;
}

/* HEADER */
.header img {
    width:100%;
}

/* INFO */
.infoText {
    text-align:center;
    font-size:13px;
    font-weight:bold;
    padding:5px;
}

/* MAP */
#map {
    height:60vh;
}

/* BUTTON */
#markerBtn {
    position:absolute;
    right:10px;
    top:130px;
    width:55px;
    height:55px;
    border-radius:50%;
    background:red;
    color:white;
    font-size:26px;
    z-index:999;
    animation:pulse 1.5s infinite;
}

@keyframes pulse {
    0% { box-shadow:0 0 0 0 rgba(255,0,0,0.7); }
    70% { box-shadow:0 0 0 20px rgba(255,0,0,0); }
    100% { box-shadow:0 0 0 0 rgba(255,0,0,0); }
}

/* MENU */
#poiMenu {
    position:absolute;
    right:10px;
    top:200px;
    width:240px;
    max-height:40vh;
    overflow:auto;
    background:white;
    display:none;
    z-index:999;
    border-radius:10px;
    padding:10px;
}

/* POI */
.dot {
    width:26px;
    height:26px;
    border-radius:50%;
}

.nuraghi { background:brown; }
.domus { background:purple; }
.borghi { background:orange; }
.pozzi { background:green; }
.tombe { background:black; }
.flora { background:darkgreen; }
.user { background:blue; }

/* RSS */
.rss {
    background:#000;
    color:#fff;
    font-size:12px;
    overflow:hidden;
}

.rss-track {
    white-space:nowrap;
    animation:scroll 35s linear infinite;
    padding:3px;
}

@keyframes scroll {
    0% { transform:translateX(100%); }
    100% { transform:translateX(-100%); }
}

/* LOGO */
.logo {
    text-align:center;
    background:#000;
    color:#fff;
    font-size:11px;
    padding:4px;
}

/* POPUP */
.overlay {
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.7);
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:2000;
}

.popup {
    background:white;
    padding:20px;
    border-radius:10px;
    text-align:center;
}

.hidden { display:none; }

</style>
</head>

<body>

<div class="header">
<img src="header-wayfinder.png">
</div>

<div class="infoText">
POI entro <span id="raggioTxt">--</span> KM
</div>

<button id="markerBtn" onclick="toggleMenu()">+</button>
<div id="poiMenu"></div>

<div id="map"></div>

<div class="rss"><div class="rss-track" id="rssEvents"></div></div>
<div class="rss"><div class="rss-track" id="rssContacts"></div></div>

<div class="logo"><b>PASSAMONTI</b>_COMMUNICATION</div>

<!-- POPUP GPS -->
<div id="gpsPopup" class="overlay">
<div class="popup">
<h3>Consenti GPS</h3>
<button onclick="enableGPS()">Consenti</button>
</div>
</div>

<!-- POPUP RAGGIO -->
<div id="radiusPopup" class="overlay hidden">
<div class="popup">
<p>Seleziona raggio</p>
<input type="range" min="1" max="200" value="50" id="radius">
<p><span id="radiusValue">50</span> km</p>
<button onclick="startApp()">Avvia</button>
</div>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

let map;
let userLat, userLon;
let radiusKm = 50;
let markers = [];

/* 🔥 TUTTI I POI (DATI REALI) */
let poiData = [
{ name:"Lollove",category:"borghi",lat:40.365,lon:9.3324},
{ name:"Tempio Pausania",category:"borghi",lat:40.9,lon:9.1},
{ name:"Aggius",category:"borghi",lat:40.93,lon:8.98},
{ name:"Atzara",category:"borghi",lat:39.99,lon:9.07},
{ name:"Bosa",category:"borghi",lat:40.3,lon:8.5},
{ name:"Carloforte",category:"borghi",lat:39.14,lon:8.3},
{ name:"Galtellì",category:"borghi",lat:40.39,lon:9.61},
{ name:"Laconi",category:"borghi",lat:39.85,lon:9.05},
{ name:"La Maddalena",category:"borghi",lat:41.21,lon:9.41},
{ name:"Oliena",category:"borghi",lat:40.27,lon:9.4},
{ name:"Posada",category:"borghi",lat:40.63,lon:9.72},
{ name:"Sadali",category:"borghi",lat:39.82,lon:9.27},
{ name:"Sardara",category:"borghi",lat:39.62,lon:8.82},
{ name:"Gavoi",category:"borghi",lat:40.16,lon:9.2},
{ name:"Castelsardo",category:"borghi",lat:40.92,lon:8.71},

{ name:"Nuraghe Arrubiu",category:"nuraghi",lat:39.66,lon:9.3},
{ name:"Su Nuraxi",category:"nuraghi",lat:39.7,lon:9.0},
{ name:"Nuraghe Losa",category:"nuraghi",lat:40.128,lon:8.82},

{ name:"Anghelu Ruju",category:"domus",lat:40.6,lon:8.29},
{ name:"Sant’Andrea Priu",category:"domus",lat:40.43,lon:8.77}
];

/* SLIDER */
document.getElementById("radius").oninput=function(){
document.getElementById("radiusValue").innerText=this.value;
}

/* GPS */
function enableGPS(){
navigator.geolocation.getCurrentPosition(pos=>{
userLat=pos.coords.latitude;
userLon=pos.coords.longitude;

document.getElementById("gpsPopup").classList.add("hidden");
document.getElementById("radiusPopup").classList.remove("hidden");
});
}

/* START */
function startApp(){
radiusKm=document.getElementById("radius").value;
document.getElementById("raggioTxt").innerText=radiusKm;

document.getElementById("radiusPopup").classList.add("hidden");

initMap();
loadPOI();
}

/* MAP */
function initMap(){
map=L.map('map').setView([userLat,userLon],10);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
}

/* POI */
function loadPOI(){

markers.forEach(m=>map.removeLayer(m));
markers=[];

document.getElementById("poiMenu").innerHTML="";

poiData.forEach(poi=>{

let d=distance(userLat,userLon,poi.lat,poi.lon);

if(d<=radiusKm){

let div=document.createElement("div");
div.className="dot "+poi.category;

let icon=L.divIcon({html:div,className:''});

let wiki="https://it.wikipedia.org/wiki/"+encodeURIComponent(poi.name);
let maps=`https://www.google.com/maps/dir/?api=1&destination=${poi.lat},${poi.lon}`;

let marker=L.marker([poi.lat,poi.lon],{icon})
.addTo(map)
.bindPopup(`<b>${poi.name}</b><br>
<a href="${wiki}" target="_blank">Wikipedia</a><br>
<a href="${maps}" target="_blank">Come arrivare</a>`);

markers.push(marker);

let item=document.createElement("div");
item.innerText=poi.name;

item.onclick=()=>{
map.setView([poi.lat,poi.lon],13);
marker.openPopup();
};

document.getElementById("poiMenu").appendChild(item);
}
});

}

/* MENU */
function toggleMenu(){
let m=document.getElementById("poiMenu");
m.style.display=m.style.display==="block"?"none":"block";
}

/* DIST */
function distance(a,b,c,d){
let R=6371;
let dLat=(c-a)*Math.PI/180;
let dLon=(d-b)*Math.PI/180;
let x=Math.sin(dLat/2)**2+
Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*
Math.sin(dLon/2)**2;
return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}

/* RSS */
document.getElementById("rssEvents").innerText =
"Eventi culturali Sardegna ✦ Mostre ✦ Festival";

document.getElementById("rssContacts").innerText =
"📞 112 ✦ 📞 118 ✦ 📞 INFOPOINT";

</script>

</body>
</html>
