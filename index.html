<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>WayFinder Sardegna</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
body { margin:0; font-family: Arial; }

/* MAP */
#map { height:70vh; }

/* STEP */
#step1 { text-align:center; padding:20px; }

/* BUTTON */
#markerBtn {
    position:fixed;
    top:180px;
    right:15px;
    width:70px;
    height:70px;
    border-radius:50%;
    background:red;
    color:white;
    font-size:32px;
    z-index:999;
    animation:pulse 1.8s infinite;
}

@keyframes pulse {
    0% { box-shadow:0 0 0 0 rgba(255,0,0,0.7); }
    70% { box-shadow:0 0 0 25px rgba(255,0,0,0); }
    100% { box-shadow:0 0 0 0 rgba(255,0,0,0); }
}

/* MENU */
#poiMenu {
    position:fixed;
    top:260px;
    right:15px;
    width:260px;
    max-height:50vh;
    overflow:auto;
    background:white;
    display:none;
    z-index:999;
    border-radius:10px;
    padding:10px;
}

/* FOOTER */
.footer {
    position:fixed;
    bottom:0;
    width:100%;
}

/* RSS */
.rss {
    background:#000;
    color:#fff;
    overflow:hidden;
    font-size:13px;
}

.rss-track {
    white-space:nowrap;
    animation:scroll 40s linear infinite;
    padding:4px;
}

@keyframes scroll {
    0% { transform:translateX(100%); }
    100% { transform:translateX(-100%); }
}

/* LOGO */
.logo {
    text-align:center;
    font-size:11px;
    background:#000;
    color:#fff;
    padding:4px;
}

/* POI */
.dot {
    width:34px;
    height:34px;
    border-radius:50%;
}

.nuraghi { background:brown; }
.domus { background:purple; }
.borghi { background:orange; }
.pozzi { background:green; }
.tombe { background:black; }
.flora { background:darkgreen; }
.user { background:blue; }

.hidden { display:none; }

</style>
</head>

<body>

<!-- STEP 1 -->
<div id="step1">
<h2>Attiva GPS</h2>
<button onclick="enableGPS()">Consenti posizione</button>

<div id="options" style="display:none;">

<p>Seleziona raggio (km)</p>
<input type="range" min="1" max="200" value="50" id="radius">
<span id="radiusValue">50 km</span>

<h3>Seleziona POI</h3>
<label><input type="checkbox" value="borghi"> Borghi</label>
<label><input type="checkbox" value="nuraghi"> Nuraghi</label>
<label><input type="checkbox" value="domus"> Domus</label>
<label><input type="checkbox" value="pozzi"> Pozzi</label>
<label><input type="checkbox" value="tombe"> Tombe</label>
<label><input type="checkbox" value="flora"> Flora</label>

<br><br>
<button onclick="startApp()">AVVIA</button>
</div>
</div>

<!-- MAP -->
<div id="mapScreen" class="hidden">

<div id="map"></div>

<button id="markerBtn" onclick="toggleMenu()">+</button>
<div id="poiMenu"></div>

<!-- FOOTER -->
<div class="footer">

    <!-- RSS EVENTI -->
    <div class="rss">
        <div class="rss-track" id="rssEvents"></div>
    </div>

    <!-- RSS NUMERI -->
    <div class="rss">
        <div class="rss-track" id="rssContacts"></div>
    </div>

    <!-- LOGO -->
    <div class="logo">
        <b>PASSAMONTI</b>_COMMUNICATION
    </div>

</div>

</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

let map;
let userLat, userLon;
let radiusKm = 50;
let selectedCategories = [];
let poiData = [];
let events = [];
let markers = [];

/* SLIDER */
document.getElementById("radius").oninput=function(){
document.getElementById("radiusValue").innerText=this.value+" km";
}

/* GPS */
function enableGPS(){
navigator.geolocation.getCurrentPosition(pos=>{
userLat=pos.coords.latitude;
userLon=pos.coords.longitude;
document.getElementById("options").style.display="block";
});
}

/* START */
function startApp(){

radiusKm=document.getElementById("radius").value;

document.querySelectorAll("input:checked").forEach(el=>{
selectedCategories.push(el.value);
});

document.getElementById("step1").classList.add("hidden");
document.getElementById("mapScreen").classList.remove("hidden");

loadData();
}

/* =========================
   🔥 INCOLLA QUI I TUOI POI
   ========================= */
let csvPOI = `
NOME,CATEGORIA,LAT,LON
`;

/* =========================
   🔥 INCOLLA QUI EVENTI
   ========================= */
let csvEVENTI = `
TITOLO,LUOGO,DATA
`;

/* PARSER */
function parseCSV(csv){
let rows=csv.trim().split("\n");
let headers=rows[0].split(",");

return rows.slice(1).map(r=>{
let v=r.split(",");
let obj={};
headers.forEach((h,i)=>obj[h.toLowerCase()]=v[i]);
return obj;
});
}

/* LOAD */
function loadData(){

let p=parseCSV(csvPOI);
poiData=p.map(x=>({
name:x.nome,
category:x.categoria,
lat:parseFloat(x.lat),
lon:parseFloat(x.lon)
}));

let e=parseCSV(csvEVENTI);
events=e.map(x=>({
titolo:x.titolo,
luogo:x.luogo,
data:x.data
}));

initMap();
loadPOI();
loadEvents();
loadContacts();

setInterval(refreshPosition,300000);
}

/* MAP */
function initMap(){
map=L.map('map',{minZoom:7,maxBounds:[[38.5,8],[41.5,10]]})
.setView([userLat,userLon],10);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

createDot(userLat,userLon,"user","TU SEI QUI");
}

/* DOT */
function createDot(lat,lon,type,label){
let div=document.createElement("div");
div.className="dot "+type;

let icon=L.divIcon({html:div,iconSize:[34,34],className:''});

let m=L.marker([lat,lon],{icon}).addTo(map).bindPopup(label);
markers.push(m);
return m;
}

/* POI */
function loadPOI(){

markers.forEach(m=>map.removeLayer(m));
markers=[];

document.getElementById("poiMenu").innerHTML="";

poiData.forEach(poi=>{

if(!selectedCategories.includes(poi.category)) return;

let d=distance(userLat,userLon,poi.lat,poi.lon);

if(d<=radiusKm){

let m=createDot(poi.lat,poi.lon,poi.category,poi.name);

let item=document.createElement("div");
item.innerText=poi.name;

item.onclick=()=>{
map.setView([poi.lat,poi.lon],13);
m.openPopup();
};

document.getElementById("poiMenu").appendChild(item);
}
});

createDot(userLat,userLon,"user","TU SEI QUI");
}

/* EVENTS */
function loadEvents(){
document.getElementById("rssEvents").innerText =
events.map(e=>`${e.titolo} - ${e.luogo} (${e.data})`).join(" ✦ ");
}

/* NUMERI */
function loadContacts(){
document.getElementById("rssContacts").innerText =
"📞 112 ✦ 📞 118 ✦ 📞 1515 ✦ 📞 INFOPOINT";
}

/* MENU */
function toggleMenu(){
let m=document.getElementById("poiMenu");
m.style.display=m.style.display==="block"?"none":"block";
}

/* REFRESH */
function refreshPosition(){
navigator.geolocation.getCurrentPosition(pos=>{
userLat=pos.coords.latitude;
userLon=pos.coords.longitude;
map.setView([userLat,userLon]);
loadPOI();
});
}

/* DIST */
function distance(a,b,c,d){
let R=6371;
let dLat=(c-a)*Math.PI/180;
let dLon=(d-b)*Math.PI/180;
let x=Math.sin(dLat/2)**2+
Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*
Math.sin(dLon/2)**2;
return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}

</script>

</body>
</html>
