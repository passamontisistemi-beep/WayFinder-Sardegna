<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>WayFinder Sardegna</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
body { margin:0; font-family:Arial; }

/* ===== HEADER ===== */
#header {
  width:100%;
  background:#fff;
  text-align:center;
}

#header img {
  width:100%;
  max-height:80px;
  object-fit:contain;
}

/* ===== INFO ===== */
#info {
  text-align:center;
  font-size:14px;
  padding:8px;
}

/* ===== SCREEN 1 ===== */
#screen1 {
  height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}

#gpsBtn {
  padding:16px 24px;
  background:black;
  color:white;
  border:none;
  border-radius:10px;
}

/* ===== SCREEN 2 ===== */
#screen2 { display:none; }

/* FILTRI DOPO GPS */
#filtri {
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  justify-content:center;
  padding:10px;
}

.filtro {
  padding:8px 12px;
  border-radius:20px;
  color:white;
  opacity:0.4;
  cursor:pointer;
}

.filtro.active {
  opacity:1;
  border:2px solid black;
}

/* MAPPA */
#map {
  height: calc(100vh - 150px);
}

/* 🔴 MARKER + */
#menuBtn {
  position:absolute;
  top:120px;
  right:20px;
  width:70px;
  height:70px;
  border-radius:50%;
  background:red;
  color:white;
  font-size:28px;
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:1000;
  animation:pulse 1.5s infinite;
}

@keyframes pulse {
  0% {transform:scale(1);}
  50% {transform:scale(1.15);}
  100% {transform:scale(1);}
}

/* MENU */
#menuPoi {
  position:absolute;
  top:200px;
  right:20px;
  width:260px;
  max-height:400px;
  overflow:auto;
  background:white;
  display:none;
  z-index:1000;
}

.poi-item {
  padding:10px;
  border-bottom:1px solid #eee;
  cursor:pointer;
}
</style>
</head>

<body>

<!-- SCREEN 1 -->
<div id="screen1">
  <h2>WayFinder Sardegna</h2>
  <button id="gpsBtn">Attiva GPS</button>
</div>

<!-- SCREEN 2 -->
<div id="screen2">

<div id="header">
  <img src="header.png">
</div>

<div id="info">
I punti di interesse mappati sono quelli presenti in un raggio di 1 km
</div>

<!-- FILTRI -->
<div id="filtri">
  <div class="filtro" data-cat="nuraghe" style="background:brown">Nuraghi</div>
  <div class="filtro" data-cat="borgo" style="background:blue">Borghi</div>
  <div class="filtro" data-cat="domus" style="background:purple">Domus</div>
  <div class="filtro" data-cat="tomba" style="background:black">Tombe</div>
  <div class="filtro" data-cat="fauna" style="background:green">Fauna</div>
</div>

<div id="menuBtn">+</div>
<div id="menuPoi"></div>

<div id="map"></div>

</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

// ===== DATI =====
const POI = [
{nome:"Bosa", lat:40.3, lon:8.5, categoria:"borgo"},
{nome:"Su Nuraxi", lat:39.7, lon:9.0, categoria:"nuraghe"},
{nome:"Anghelu Ruju", lat:40.6, lon:8.29, categoria:"domus"},
{nome:"Coddu Vecchiu", lat:41.08, lon:9.38, categoria:"tomba"},
{nome:"Fenicottero rosa", lat:39.22, lon:9.14, categoria:"fauna"}
];

let map, userLat, userLon;
let markers = {};
let categorieAttive = [];

// ===== DISTANZA =====
function distanza(a,b,c,d){
  let R=6371;
  let dLat=(c-a)*Math.PI/180;
  let dLon=(d-b)*Math.PI/180;
  let x=Math.sin(dLat/2)**2+
    Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(dLon/2)**2;
  return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}

// ===== GPS =====
document.getElementById("gpsBtn").onclick = ()=>{

  navigator.geolocation.getCurrentPosition(pos=>{

    userLat = pos.coords.latitude;
    userLon = pos.coords.longitude;

    document.getElementById("screen1").style.display="none";
    document.getElementById("screen2").style.display="block";

    map = L.map('map').setView([userLat,userLon],13);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

    // TU SEI QUI
    L.circleMarker([userLat,userLon],{
      radius:14,
      color:"white",
      fillColor:"red",
      fillOpacity:1,
      weight:3
    }).addTo(map).bindPopup("Tu sei qui").openPopup();

  });
};

// ===== FILTRI =====
document.querySelectorAll(".filtro").forEach(btn=>{
  btn.onclick = ()=>{

    let cat = btn.dataset.cat;

    if(categorieAttive.includes(cat)){
      categorieAttive = categorieAttive.filter(c=>c!==cat);
      btn.classList.remove("active");
    } else {
      categorieAttive.push(cat);
      btn.classList.add("active");
    }

    aggiornaMappa();
    creaMenu();
  };
});

// ===== AGGIORNA MAPPA =====
function aggiornaMappa(){

  // pulizia
  for(let k in markers){
    map.removeLayer(markers[k]);
  }
  markers = {};

  POI.forEach(p=>{

    if(categorieAttive.includes(p.categoria)
       && distanza(userLat,userLon,p.lat,p.lon)<=1){

      let m = L.circleMarker([p.lat,p.lon],{
        radius:7,
        color:"blue",
        fillColor:"blue",
        fillOpacity:1
      }).addTo(map);

      markers[p.nome] = m;

      m.on("click",()=>alert(p.nome));
    }
  });
}

// ===== MENU =====
function creaMenu(){

  let menu=document.getElementById("menuPoi");
  menu.innerHTML="";

  POI.forEach(p=>{
    if(categorieAttive.includes(p.categoria)
       && distanza(userLat,userLon,p.lat,p.lon)<=1){

      let div=document.createElement("div");
      div.className="poi-item";
      div.innerText=p.nome;
      div.onclick=()=>map.setView([p.lat,p.lon],15);
      menu.appendChild(div);
    }
  });
}

document.getElementById("menuBtn").onclick=()=>{
  let m=document.getElementById("menuPoi");
  m.style.display = m.style.display==="none"?"block":"none";
};

</script>

</body>
</html>
