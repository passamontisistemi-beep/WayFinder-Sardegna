<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I Giganti della Sardegna</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #2f2f2f;
    color: white;
    text-align: center;
}

.container {
    padding: 20px;
}

h1 {
    color: #ffe600;
    font-size: 40px;
    line-height: 1.1;
}

button {
    width: 80%;
    padding: 15px;
    margin: 15px 0;
    font-size: 20px;
    border: none;
    border-radius: 10px;
    background: #ffe600;
    color: black;
    font-weight: bold;
    cursor: pointer;
}

#raggioMenu {
    display: none;
    background: #444;
    padding: 15px;
    border-radius: 10px;
    width: 80%;
    margin: 0 auto;
}

label {
    display: block;
    margin: 10px;
    font-size: 18px;
}

.footer {
    margin-top: 30px;
    font-size: 14px;
    opacity: 0.7;
}
</style>

</head>

<body>

<div class="container">

    <h1>I Giganti<br>della Sardegna</h1>

    <button onclick="attivaGPS()">AUTORIZZA GPS</button>

    <button onclick="toggleRaggio()">RAGGIO RICERCA</button>

    <div id="raggioMenu">
        <label><input type="radio" name="raggio" value="50"> 50 Km</label>
        <label><input type="radio" name="raggio" value="100"> 100 Km</label>
        <label><input type="radio" name="raggio" value="tutti"> Tutti</label>
    </div>

    <div id="status" style="margin-top:15px;"></div>

    <div class="footer">PASSAMONTI COMMUNICATION</div>

</div>

<script>

function toggleRaggio() {
    let menu = document.getElementById("raggioMenu");
    menu.style.display = (menu.style.display === "none") ? "block" : "none";
}

function attivaGPS() {
    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
            function(position) {
                document.getElementById("status").innerHTML = "GPS ATTIVO ✅";
            },
            function(error) {
                document.getElementById("status").innerHTML = "Permesso negato ❌";
            }
        );
    } else {
        document.getElementById("status").innerHTML = "GPS non supportato";
    }
}

</script>

</body>
</html>
