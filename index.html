<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>WayFinder Sardegna</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
body { margin:0; font-family:Arial; }

/* HEADER */
#header img {
  width:100%;
  max-height:120px;
  object-fit:cover;
}

/* INFO */
#info {
  text-align:center;
  padding:8px;
  font-size:14px;
}

/* SCREEN 1 */
#screen1 {
  height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}

#gpsBtn {
  padding:16px;
  background:black;
  color:white;
  border:none;
  border-radius:10px;
}

/* SCREEN 2 */
#screen2 { display:none; }

/* FILTRI */
#filtri {
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:10px;
  padding:10px;
}

/* MAPPA */
#map {
  height:55vh;
}

/* 🔴 MARKER + (CORRETTO) */
#menuBtn {
  position:absolute;
  top:150px;
  right:20px;
  width:80px;
  height:80px;
  border-radius:50%;
  background:red;
  color:white;
  font-size:32px;
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:1000;
  cursor:pointer;
  animation:pulse 1.2s infinite;
}

@keyframes pulse {
  0% {transform:scale(1);}
  50% {transform:scale(1.25);}
  100% {transform:scale(1);}
}

/* MENU */
#menuPoi {
  position:absolute;
  top:250px;
  right:20px;
  width:260px;
  max-height:350px;
  overflow:auto;
  background:white;
  display:none;
  z-index:1000;
  border-radius:10px;
}

.poi-item {
  padding:10px;
  border-bottom:1px solid #eee;
  cursor:pointer;
}

/* RSS */
#rss {
  font-size:12px;
  padding:5px;
  background:#f5f5f5;
}

/* FOOTER */
#footer {
  text-align:center;
  font-size:12px;
  padding:10px;
}
</style>
</head>

<body>

<!-- SCREEN 1 -->
<div id="screen1">
  <h2>WayFinder Sardegna</h2>
  <button id="gpsBtn">Attiva GPS</button>
</div>

<!-- SCREEN 2 -->
<div id="screen2">

<div id="header">
  <img src="header-wayfinder.png">
</div>

<div id="info">
I punti di interesse mappati sono quelli presenti in un raggio di 1 km
</div>

<div id="filtri">
<label><input type="checkbox" value="borgo"> Borghi</label>
<label><input type="checkbox" value="nuraghe"> Nuraghi</label>
<label><input type="checkbox" value="domus"> Domus</label>
<label><input type="checkbox" value="tomba"> Tombe</label>
<label><input type="checkbox" value="fauna"> Fauna</label>
</div>

<div id="menuBtn">+</div>
<div id="menuPoi"></div>

<div id="map"></div>

<!-- RSS -->
<div id="rss">
<div>📰 Eventi e comunicazioni istituzionali in aggiornamento...</div>
<div>📞 <a href="tel:112">112</a> | InfoPoint locale</div>
</div>

<!-- FOOTER -->
<div id="footer">
<b>PASSAMONTI</b>_COMMUNICATION
</div>

</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

const POI = [
{nome:"Bosa", lat:40.3, lon:8.5, cat:"borgo"},
{nome:"Su Nuraxi", lat:39.7, lon:9.0, cat:"nuraghe"},
{nome:"Anghelu Ruju", lat:40.6, lon:8.29, cat:"domus"},
{nome:"Coddu Vecchiu", lat:41.08, lon:9.38, cat:"tomba"},
{nome:"Fenicottero rosa", lat:39.22, lon:9.14, cat:"fauna"}
];

let map, userLat, userLon;
let markers = [];

// DISTANZA
function distanza(a,b,c,d){
let R=6371;
let dLat=(c-a)*Math.PI/180;
let dLon=(d-b)*Math.PI/180;
let x=Math.sin(dLat/2)**2+
Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(dLon/2)**2;
return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}

// GPS
document.getElementById("gpsBtn").onclick=()=>{
navigator.geolocation.getCurrentPosition(pos=>{

userLat=pos.coords.latitude;
userLon=pos.coords.longitude;

document.getElementById("screen1").style.display="none";
document.getElementById("screen2").style.display="block";

map=L.map('map',{dragging:false}).setView([40.1,9],8);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

// TU SEI QUI
L.circleMarker([userLat,userLon],{
radius:14,color:"white",fillColor:"red",fillOpacity:1,weight:3
}).addTo(map);

});
};

// FILTRI
document.querySelectorAll("#filtri input").forEach(cb=>{
cb.onchange=()=>aggiorna();
});

function aggiorna(){

markers.forEach(m=>map.removeLayer(m));
markers=[];

let menu=document.getElementById("menuPoi");
menu.innerHTML="";

let attivi=[...document.querySelectorAll("#filtri input:checked")].map(x=>x.value);

POI.forEach(p=>{

if(attivi.includes(p.cat) && distanza(userLat,userLon,p.lat,p.lon)<=1){

let m=L.circleMarker([p.lat,p.lon],{
radius:6,fillColor:"blue",color:"blue",fillOpacity:1
}).addTo(map);

markers.push(m);

// popup
m.on("click",()=>{
let wiki=encodeURIComponent(p.nome.replace(/ /g,"_"));
m.bindPopup(`
<b>${p.nome}</b><br><br>
<a href="https://it.wikipedia.org/wiki/${wiki}" target="_blank">Wikipedia</a><br><br>
<a href="https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lon}" target="_blank">Portami qui</a>
`).openPopup();
});

// menu
let div=document.createElement("div");
div.className="poi-item";
div.innerText=p.nome;
div.onclick=()=>{
map.setView([p.lat,p.lon],15);
};
menu.appendChild(div);

}
});
}

// MENU BUTTON
document.getElementById("menuBtn").onclick=()=>{
let m=document.getElementById("menuPoi");
m.style.display = m.style.display==="none"?"block":"none";
};

// REFRESH 5 MIN
setInterval(()=>{
navigator.geolocation.getCurrentPosition(pos=>{
userLat=pos.coords.latitude;
userLon=pos.coords.longitude;
aggiorna();
});
},300000);

</script>

</body>
</html>
