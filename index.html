<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>WayFinder Sardegna</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
body { margin:0; font-family:Arial; }

/* SCHERMATE */
.screen { display:none; }
.active { display:flex; }

/* START */
#start {
  height:100vh;
  justify-content:center;
  align-items:center;
}

#start button {
  padding:20px;
  font-size:20px;
  background:black;
  color:white;
  border:none;
  border-radius:10px;
}

/* RAGGIO */
#raggioScreen {
  height:100vh;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}

#slider {
  width:80%;
}

#valore {
  font-size:20px;
  margin:10px;
}

/* APP */
#app { display:none; flex-direction:column; }

/* HEADER */
#header img {
  width:100%;
  height:70px;
  object-fit:cover;
}

/* INFO */
#info {
  text-align:center;
  font-size:14px;
  padding:5px;
  font-weight:bold;
}

/* FILTRI */
#filtri {
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:8px;
  padding:8px;
}

/* MAP */
#map {
  height:50vh;
}

/* MENU */
#menuBtn {
  position:absolute;
  top:110px;
  right:20px;
  width:80px;
  height:80px;
  background:red;
  border-radius:50%;
  color:white;
  font-size:40px;
  display:flex;
  justify-content:center;
  align-items:center;
  cursor:pointer;
  z-index:1000;
}

/* RSS */
#rss {
  background:black;
  color:white;
  font-weight:bold;
}

.marquee {
  overflow:hidden;
  white-space:nowrap;
}

.marquee div {
  display:inline-block;
  padding-left:100%;
  animation:scroll 15s linear infinite;
}

@keyframes scroll {
  0% { transform:translateX(0); }
  100% { transform:translateX(-100%); }
}

/* FOOTER */
#footer {
  text-align:center;
  padding:10px;
}
</style>
</head>

<body>

<!-- START -->
<div id="start" class="screen active">
  <button onclick="startGPS()">WayFinder</button>
</div>

<!-- RAGGIO -->
<div id="raggioScreen" class="screen">
  <h2>Seleziona raggio di navigazione</h2>

  <input type="range" id="slider" min="1" max="50" value="10">

  <div id="valore">10 km</div>

  <button onclick="entraApp()">Conferma</button>
</div>

<!-- APP -->
<div id="app" class="screen">

<div id="header">
  <img src="header-wayfinder.png">
</div>

<div id="info">
I punti di interesse mappati sono quelli presenti in un raggio di <span id="raggioTxt"></span> km
</div>

<div id="filtri">
<label><input type="checkbox" id="all"> Tutti</label>
<label><input type="checkbox" value="borgo"> Borghi</label>
<label><input type="checkbox" value="nuraghe"> Nuraghi</label>
<label><input type="checkbox" value="domus"> Domus</label>
<label><input type="checkbox" value="tomba"> Tombe</label>
<label><input type="checkbox" value="fauna"> Fauna</label>
</div>

<div id="rss">
<div class="marquee"><div>EVENTI E COMUNICAZIONI ISTITUZIONALI</div></div>
<div class="marquee"><div>📞 112 | INFOPOINT</div></div>
</div>

<div id="menuBtn" onclick="toggleMenu()">+</div>
<div id="menuPoi"></div>

<div id="map"></div>

<div id="footer">
<b>PASSAMONTI</b>_COMMUNICATION
</div>

</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

let raggio = 10;
let map, userLat, userLon;
let markers=[];

const POI = [
{nome:"Bosa", lat:40.3, lon:8.5, cat:"borgo"},
{nome:"Su Nuraxi", lat:39.7, lon:9.0, cat:"nuraghe"},
{nome:"Anghelu Ruju", lat:40.6, lon:8.29, cat:"domus"}
];

// SLIDER
let slider=document.getElementById("slider");
slider.oninput = function(){
raggio=this.value;
document.getElementById("valore").innerText = raggio + " km";
};

// GPS
function startGPS(){
navigator.geolocation.getCurrentPosition(pos=>{
userLat=pos.coords.latitude;
userLon=pos.coords.longitude;

document.getElementById("start").classList.remove("active");
document.getElementById("raggioScreen").classList.add("active");
});
}

// ENTRA APP
function entraApp(){

document.getElementById("raggioScreen").classList.remove("active");
document.getElementById("app").classList.add("active");

document.getElementById("raggioTxt").innerText = raggio;

initMap();
aggiorna();
}

// MAP
function initMap(){
map=L.map('map',{dragging:false}).setView([40.1,9],8);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

L.circleMarker([userLat,userLon],{
radius:12,fillColor:"red",color:"white",weight:3
}).addTo(map);
}

// DISTANZA
function distanza(a,b,c,d){
let R=6371;
let dLat=(c-a)*Math.PI/180;
let dLon=(d-b)*Math.PI/180;
let x=Math.sin(dLat/2)**2+
Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(dLon/2)**2;
return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}

// AGGIORNA
function aggiorna(){
markers.forEach(m=>map.removeLayer(m));
markers=[];

let attivi=[...document.querySelectorAll("#filtri input:checked")]
.map(x=>x.value).filter(v=>v);

POI.forEach(p=>{
if(attivi.includes(p.cat) && distanza(userLat,userLon,p.lat,p.lon)<=raggio){

let m=L.circleMarker([p.lat,p.lon]).addTo(map);
markers.push(m);
}
});
}

// MENU
function toggleMenu(){
let m=document.getElementById("menuPoi");
m.style.display = m.style.display==="none"?"block":"none";
}

</script>

</body>
</html>
