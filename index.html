<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>WayFinder Sardegna</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
body { margin:0; font-family:Arial; }

/* ===== SCREEN 1 ===== */
#screen1 {
  height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding:20px;
}

#gpsBtn {
  padding:16px 24px;
  background:black;
  color:white;
  border:none;
  border-radius:10px;
  font-size:16px;
}

/* LEGENDA */
#legenda {
  margin-top:20px;
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  justify-content:center;
}

.legenda-item {
  padding:6px 10px;
  border-radius:20px;
  color:white;
  font-size:12px;
}

/* ===== SCREEN 2 ===== */
#screen2 { display:none; }

#map { height:100vh; }

/* 🔴 MARKER + SUPER ANIMATO */
#menuBtn {
  position:absolute;
  top:20px;
  right:20px;
  width:75px;
  height:75px;
  border-radius:50%;
  background:red;
  color:white;
  font-size:28px;
  display:flex;
  justify-content:center;
  align-items:center;
  cursor:pointer;
  z-index:1000;

  box-shadow:0 0 0 rgba(255,0,0,0.7);
  animation:pulse 1.5s infinite;
}

@keyframes pulse {
  0% { transform:scale(1); box-shadow:0 0 0 0 rgba(255,0,0,0.7);}
  70% { transform:scale(1.15); box-shadow:0 0 25px 15px rgba(255,0,0,0);}
  100% { transform:scale(1); box-shadow:0 0 0 0 rgba(255,0,0,0);}
}

/* MENU */
#menuPoi {
  position:absolute;
  top:100px;
  right:20px;
  width:260px;
  max-height:400px;
  overflow:auto;
  background:white;
  display:none;
  z-index:1000;
}

.poi-item {
  padding:10px;
  border-bottom:1px solid #eee;
  cursor:pointer;
}
</style>
</head>

<body>

<!-- ===== HOMEPAGE ===== -->
<div id="screen1">

<h2>WayFinder Sardegna</h2>

<p>Attiva la geolocalizzazione per scoprire i punti di interesse intorno a te</p>

<button id="gpsBtn">Attiva GPS</button>

<div id="legenda">
  <div class="legenda-item" style="background:brown">Nuraghi</div>
  <div class="legenda-item" style="background:blue">Borghi</div>
  <div class="legenda-item" style="background:purple">Domus</div>
  <div class="legenda-item" style="background:black">Tombe</div>
  <div class="legenda-item" style="background:green">Fauna</div>
</div>

</div>

<!-- ===== MAPPA ===== -->
<div id="screen2">

<div id="menuBtn">+</div>
<div id="menuPoi"></div>

<div id="map"></div>

</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

// ===== DATI (estratto reale) =====
const POI = [
{nome:"Bosa", lat:40.3, lon:8.5, categoria:"borgo"},
{nome:"Su Nuraxi", lat:39.7, lon:9.0, categoria:"nuraghe"},
{nome:"Anghelu Ruju", lat:40.6, lon:8.29, categoria:"domus"},
{nome:"Coddu Vecchiu", lat:41.08, lon:9.38, categoria:"tomba"},
{nome:"Fenicottero rosa", lat:39.22, lon:9.14, categoria:"fauna"}
];

let map, userMarker;
let markers = {};
let selected = null;
let userLat, userLon;

// ===== DISTANZA =====
function distanza(a,b,c,d){
  let R=6371;
  let dLat=(c-a)*Math.PI/180;
  let dLon=(d-b)*Math.PI/180;
  let x=Math.sin(dLat/2)**2+
    Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(dLon/2)**2;
  return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}

// ===== COLORI =====
function colore(cat){
  return cat==="nuraghe"?"brown":
         cat==="domus"?"purple":
         cat==="tomba"?"black":
         cat==="fauna"?"green":
         cat==="borgo"?"blue":"gray";
}

// ===== GPS =====
document.getElementById("gpsBtn").onclick = ()=>{

  navigator.geolocation.getCurrentPosition(pos=>{

    userLat = pos.coords.latitude;
    userLon = pos.coords.longitude;

    document.getElementById("screen1").style.display="none";
    document.getElementById("screen2").style.display="block";

    map = L.map('map').setView([userLat,userLon],13);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

    // TU SEI QUI GRANDE
    userMarker = L.circleMarker([userLat,userLon],{
      radius:14,
      color:"white",
      fillColor:"red",
      fillOpacity:1,
      weight:3
    }).addTo(map).bindPopup("Tu sei qui").openPopup();

    caricaPOI();
    creaMenu();

  });
};

// ===== CARICA POI (1 KM) =====
function caricaPOI(){

  POI.forEach(p=>{

    if(distanza(userLat,userLon,p.lat,p.lon)<=1){

      let m = L.circleMarker([p.lat,p.lon],{
        radius:7,
        color:colore(p.categoria),
        fillColor:colore(p.categoria),
        fillOpacity:1
      }).addTo(map);

      markers[p.nome]=m;

      m.on("click",()=>seleziona(p));
    }

  });
}

// ===== MENU =====
function creaMenu(){
  let menu=document.getElementById("menuPoi");

  POI.forEach(p=>{
    if(distanza(userLat,userLon,p.lat,p.lon)<=1){

      let div=document.createElement("div");
      div.className="poi-item";
      div.innerText=p.nome;
      div.onclick=()=>seleziona(p);
      menu.appendChild(div);

    }
  });
}

// ===== TOGGLE MENU =====
document.getElementById("menuBtn").onclick=()=>{
  let m=document.getElementById("menuPoi");
  m.style.display = m.style.display==="none"?"block":"none";
};

// ===== SELEZIONE + POPUP =====
function seleziona(p){

  if(selected){
    let old=markers[selected.nome];
    old.setStyle({
      fillColor:colore(selected.categoria),
      color:colore(selected.categoria),
      radius:7
    });
  }

  let m=markers[p.nome];

  map.setView([p.lat,p.lon],15);

  m.setStyle({
    fillColor:"red",
    color:"red",
    radius:12
  });

  selected=p;

  let wiki = encodeURIComponent(p.nome.replace(/ /g,"_"));
  let wikiURL = `https://it.wikipedia.org/wiki/${wiki}`;
  let mapsURL = `https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lon}`;

  let popup = `
    <b>${p.nome}</b><br><br>
    <a href="${wikiURL}" target="_blank">📖 Wikipedia</a><br><br>
    <a href="${mapsURL}" target="_blank">📍 Portami qui</a>
  `;

  m.bindPopup(popup).openPopup();
}

</script>

</body>
</html>
