<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>WayFinder Sardegna</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
/* 👉 STILE IDENTICO (NON TOCCATO) */
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{
background:#dfe7ee;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:10px;
}
#app{
width:min(100vw,390px);
aspect-ratio:9/16;
background:#fff;
border-radius:28px;
overflow:hidden;
box-shadow:0 20px 60px rgba(0,0,0,.25);
display:flex;
flex-direction:column;
position:relative;
}
#header img{width:100%;display:block;}
#topBar{
padding:10px;
text-align:center;
font-size:13px;
font-weight:800;
background:#fff;
border-bottom:1px solid #ddd;
min-height:52px;
}
#mapWrap{position:relative;flex:1;}
#map{width:100%;height:100%;}

/* BUTTON */
#plusBtn{
position:absolute;
top:12px;
right:12px;
width:62px;
height:62px;
border-radius:50%;
background:#ff0000;
color:#fff;
font-size:40px;
font-weight:900;
z-index:1500;
animation:pulse 1.1s infinite;
}
@keyframes pulse{
0%{transform:scale(1)}
50%{transform:scale(1.12)}
100%{transform:scale(1)}
}

/* PANEL */
#poiPanel{
position:absolute;
left:12px;
right:12px;
top:88px;
max-height:48%;
background:#fff;
border-radius:18px;
box-shadow:0 15px 35px rgba(0,0,0,.25);
z-index:1600;
display:none;
overflow:hidden;
}
#poiPanelHeader{
padding:12px;
font-weight:700;
background:#000;
color:#fff;
display:flex;
justify-content:space-between;
}
#poiList{max-height:280px;overflow:auto;}
.poiItem{padding:12px;border-bottom:1px solid #eee;cursor:pointer;font-weight:600}

/* CARD */
#detailCard{
position:absolute;
left:12px;
right:12px;
top:24%;
background:#fff;
border-radius:18px;
box-shadow:0 15px 35px rgba(0,0,0,.25);
z-index:1700;
display:none;
padding:14px;
}
.btn{width:100%;padding:10px;border:none;border-radius:10px;margin-top:8px;font-weight:700}

/* FOOTER */
footer{
height:95px;
background:#111;
color:#fff;
display:flex;
flex-direction:column;
justify-content:center;
}
.rss{height:24px;overflow:hidden;white-space:nowrap;}
.track{display:inline-block;padding-left:100%;animation:scroll 30s linear infinite;}
@keyframes scroll{0%{transform:translateX(0)}100%{transform:translateX(-100%)}}
.brand{text-align:center;font-size:10px}

/* POPUP */
.overlay{
position:absolute;
inset:0;
background:rgba(0,0,0,.65);
display:flex;
align-items:center;
justify-content:center;
z-index:3000;
}
.popup{background:#fff;padding:20px;border-radius:20px;text-align:center}
.hidden{display:none}
</style>
</head>

<body>

<div id="app">

<!-- GPS -->
<div id="gpsModal" class="overlay">
<div class="popup">
<h2>Autorizzazione GPS</h2>
<button id="gpsBtn">Consenti</button>
</div>
</div>

<!-- HEADER -->
<div id="header">
<img src="header-wayfinder.png">
</div>

<div id="topBar">
POI entro <span id="raggioTxt">--</span> KM
</div>

<div id="mapWrap">
<div id="map"></div>
<button id="plusBtn">+</button>

<div id="poiPanel">
<div id="poiPanelHeader">
<span>Punti di Interesse</span>
<button onclick="closePanel()">✕</button>
</div>
<div id="poiList"></div>
</div>
</div>

<div id="detailCard">
<h2 id="poiTitle"></h2>
<p id="poiDistance"></p>
<button class="btn" id="wikiBtn">Wikipedia</button>
<button class="btn" id="goBtn">Come arrivare</button>
<button class="btn" onclick="closeCard()">Chiudi</button>
</div>

<footer>
<div class="rss"><div class="track">Eventi culturali Sardegna ✦ Mostre ✦ Festival</div></div>
<div class="rss"><div class="track">📞 112 ✦ 📞 118 ✦ 📞 INFOPOINT</div></div>
<div class="brand"><b>PASSAMONTI</b>_COMMUNICATION</div>
</footer>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

let map=L.map("map").setView([40,9],8);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png").addTo(map);

let userLat=40,userLng=9;
let poiLayer=L.layerGroup().addTo(map);

/* 🔥 TUOI POI REALI */
let poiData=[
{name:"Bosa",lat:40.3,lon:8.5},
{name:"Lollove",lat:40.365,lon:9.3324},
{name:"Nuraghe Arrubiu",lat:39.66,lon:9.3},
{name:"Anghelu Ruju",lat:40.6,lon:8.29}
];

/* GPS */
document.getElementById("gpsBtn").onclick=function(){
navigator.geolocation.getCurrentPosition(pos=>{
userLat=pos.coords.latitude;
userLng=pos.coords.longitude;

document.getElementById("gpsModal").style.display="none";

drawUser();
loadPOI();
});
};

/* USER */
function drawUser(){
L.marker([userLat,userLng]).addTo(map).bindPopup("TU SEI QUI");
map.setView([userLat,userLng],12);
}

/* POI */
function loadPOI(){
poiLayer.clearLayers();

poiData.forEach(p=>{
let m=L.circleMarker([p.lat,p.lon],{
radius:8,color:"#000",fillColor:"red",fillOpacity:1
}).addTo(poiLayer);

m.on("click",()=>openDetail(p));
});

renderList();
}

/* LIST */
function renderList(){
let list=document.getElementById("poiList");
list.innerHTML="";

poiData.forEach(p=>{
let div=document.createElement("div");
div.className="poiItem";
div.innerText=p.name;

div.onclick=function(){
map.setView([p.lat,p.lon],13);
};

list.appendChild(div);
});
}

/* CARD */
function openDetail(p){
document.getElementById("poiTitle").innerText=p.name;

document.getElementById("wikiBtn").onclick=function(){
window.open("https://it.wikipedia.org/wiki/"+encodeURIComponent(p.name));
};

document.getElementById("goBtn").onclick=function(){
window.open(`https://www.google.com/maps/dir/${userLat},${userLng}/${p.lat},${p.lon}`);
};

document.getElementById("detailCard").style.display="block";
}

function closeCard(){document.getElementById("detailCard").style.display="none";}
function closePanel(){document.getElementById("poiPanel").style.display="none";}

document.getElementById("plusBtn").onclick=function(){
let p=document.getElementById("poiPanel");
p.style.display=(p.style.display==="block")?"none":"block";
};

</script>

</body>
</html>
