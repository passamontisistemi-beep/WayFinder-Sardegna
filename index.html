<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>WayFinder Sardegna</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
body { margin:0; font-family:Arial; }

/* ===== START ===== */
#start {
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
}

#start button {
  padding:20px;
  font-size:20px;
  background:black;
  color:white;
  border:none;
  border-radius:10px;
}

/* ===== APP ===== */
#app { display:none; }

/* HEADER */
#header img {
  width:100%;
  height:90px;
  object-fit:cover;
}

/* INFO */
#info {
  text-align:center;
  font-size:14px;
  padding:5px;
}

/* FILTRI */
#filtri {
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:8px;
  padding:8px;
}

/* MAP */
#map {
  height:55vh;
}

/* MARKER + */
#menuBtn {
  position:absolute;
  top:120px;
  right:20px;
  width:80px;
  height:80px;
  background:red;
  border-radius:50%;
  color:white;
  font-size:40px;
  display:flex;
  justify-content:center;
  align-items:center;
  cursor:pointer;
  z-index:1000;
  box-shadow:0 0 20px rgba(255,0,0,0.7);
  animation:pulse 1.2s infinite;
}

@keyframes pulse {
  0% {transform:scale(1);}
  50% {transform:scale(1.2);}
  100% {transform:scale(1);}
}

/* MENU */
#menuPoi {
  position:absolute;
  top:220px;
  right:20px;
  width:260px;
  max-height:300px;
  overflow:auto;
  background:white;
  display:none;
  border-radius:10px;
  z-index:1000;
}

.poi-item {
  padding:10px;
  border-bottom:1px solid #eee;
  cursor:pointer;
}

/* RSS */
#rss {
  position:fixed;
  bottom:0;
  width:100%;
  background:#000;
  color:#fff;
  font-weight:bold;
  font-size:13px;
}

.marquee {
  overflow:hidden;
  white-space:nowrap;
}

.marquee div {
  display:inline-block;
  padding-left:100%;
  animation:scroll 18s linear infinite;
}

@keyframes scroll {
  0% { transform:translateX(0); }
  100% { transform:translateX(-100%); }
}

/* FOOTER */
#footer {
  text-align:center;
  font-size:12px;
  padding:5px;
}
</style>
</head>

<body>

<!-- START -->
<div id="start">
  <button onclick="startApp()">WayFinder</button>
</div>

<!-- APP -->
<div id="app">

<div id="header">
  <img src="header-wayfinder.png">
</div>

<div id="info">
I punti di interesse mappati sono quelli presenti in un raggio di 1 km
</div>

<div id="filtri">
<label><input type="checkbox" value="borgo"> Borghi</label>
<label><input type="checkbox" value="nuraghe"> Nuraghi</label>
<label><input type="checkbox" value="domus"> Domus</label>
<label><input type="checkbox" value="tomba"> Tombe</label>
<label><input type="checkbox" value="fauna"> Fauna</label>
</div>

<div id="menuBtn" onclick="toggleMenu()">+</div>
<div id="menuPoi"></div>

<div id="map"></div>

<div id="rss">
<div class="marquee"><div>EVENTI E COMUNICAZIONI ISTITUZIONALI IN TEMPO REALE</div></div>
<div class="marquee"><div>📞 112 | INFOPOINT TERRITORIALE</div></div>
</div>

<div id="footer">
<b>PASSAMONTI</b>_COMMUNICATION
</div>

</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

// ===== DATA =====
const POI = [
{nome:"Bosa", lat:40.3, lon:8.5, cat:"borgo"},
{nome:"Su Nuraxi", lat:39.7, lon:9.0, cat:"nuraghe"},
{nome:"Anghelu Ruju", lat:40.6, lon:8.29, cat:"domus"},
{nome:"Coddu Vecchiu", lat:41.08, lon:9.38, cat:"tomba"},
{nome:"Fenicottero rosa", lat:39.22, lon:9.14, cat:"fauna"}
];

let map, userLat, userLon;
let markers=[];

// DISTANZA
function distanza(a,b,c,d){
let R=6371;
let dLat=(c-a)*Math.PI/180;
let dLon=(d-b)*Math.PI/180;
let x=Math.sin(dLat/2)**2+
Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(dLon/2)**2;
return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}

// START
function startApp(){
navigator.geolocation.getCurrentPosition(pos=>{

userLat=pos.coords.latitude;
userLon=pos.coords.longitude;

document.getElementById("start").style.display="none";
document.getElementById("app").style.display="block";

initMap();
aggiorna();

});
}

// MAP
function initMap(){
map=L.map('map',{dragging:false}).setView([40.1,9],8);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

L.circleMarker([userLat,userLon],{
radius:12,fillColor:"red",color:"white",weight:3,fillOpacity:1
}).addTo(map);
}

// FILTRI
document.querySelectorAll("#filtri input").forEach(cb=>{
cb.onchange=aggiorna;
});

// AGGIORNA
function aggiorna(){

markers.forEach(m=>map.removeLayer(m));
markers=[];

let menu=document.getElementById("menuPoi");
menu.innerHTML="";

let attivi=[...document.querySelectorAll("#filtri input:checked")].map(x=>x.value);

POI.forEach(p=>{

if(attivi.includes(p.cat) && distanza(userLat,userLon,p.lat,p.lon)<=1){

let m=L.circleMarker([p.lat,p.lon],{
radius:6,fillColor:"blue",color:"blue",fillOpacity:1
}).addTo(map);

markers.push(m);

// popup
m.on("click",()=>{
let wiki=encodeURIComponent(p.nome.replace(/ /g,"_"));
m.bindPopup(`
<b>${p.nome}</b><br><br>
<a href="https://it.wikipedia.org/wiki/${wiki}" target="_blank">Wikipedia</a><br><br>
<a href="https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lon}" target="_blank">Portami qui</a>
`).openPopup();
});

// menu
let div=document.createElement("div");
div.className="poi-item";
div.innerText=p.nome;
div.onclick=()=>map.setView([p.lat,p.lon],15);
menu.appendChild(div);

}
});
}

// MENU
function toggleMenu(){
let m=document.getElementById("menuPoi");
m.style.display = m.style.display==="none"?"block":"none";
}

// REFRESH
setInterval(()=>{
navigator.geolocation.getCurrentPosition(pos=>{
userLat=pos.coords.latitude;
userLon=pos.coords.longitude;
aggiorna();
});
},300000);

</script>

</body>
</html>
