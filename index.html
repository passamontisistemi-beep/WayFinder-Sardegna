<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>WayFinder Sardegna</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
body { margin:0; font-family:Arial; }

/* ===== SCREEN FLOW ===== */
.screen { display:none; }
.active { display:block; }

/* ===== SCREEN START ===== */
#start {
  height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}

#start button {
  padding:20px;
  font-size:20px;
  background:black;
  color:white;
  border:none;
  border-radius:10px;
}

/* ===== HEADER ===== */
#header img {
  width:100%;
  height:80px;
  object-fit:cover;
}

/* ===== INFO ===== */
#info {
  text-align:center;
  font-size:14px;
  padding:5px;
}

/* ===== FILTRI ===== */
#filtri {
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:8px;
  padding:8px;
}

/* ===== MAP ===== */
#map {
  height:55vh;
}

/* ===== MARKER + ===== */
#menuBtn {
  position:absolute;
  top:120px;
  right:20px;
  width:80px;
  height:80px;
  border-radius:50%;
  background:red;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:40px;
  color:white;
  z-index:1000;
  cursor:pointer;
  box-shadow:0 0 20px rgba(255,0,0,0.7);
  animation:pulse 1.2s infinite;
}

@keyframes pulse {
  0% { transform:scale(1); }
  50% { transform:scale(1.2); }
  100% { transform:scale(1); }
}

/* ===== MENU ===== */
#menuPoi {
  position:absolute;
  top:220px;
  right:20px;
  width:260px;
  max-height:300px;
  overflow:auto;
  background:white;
  display:none;
  z-index:1000;
  border-radius:10px;
}

.poi-item {
  padding:10px;
  border-bottom:1px solid #eee;
}

/* ===== RSS ===== */
#rss {
  position:fixed;
  bottom:0;
  width:100%;
  background:#000;
  color:#fff;
  font-weight:bold;
  font-size:13px;
}

.marquee {
  white-space:nowrap;
  overflow:hidden;
}

.marquee div {
  display:inline-block;
  padding-left:100%;
  animation:scroll 15s linear infinite;
}

@keyframes scroll {
  0% { transform:translateX(0); }
  100% { transform:translateX(-100%); }
}

/* ===== FOOTER ===== */
#footer {
  text-align:center;
  font-size:12px;
  padding:5px;
}
</style>
</head>

<body>

<!-- ===== START ===== -->
<div id="start" class="screen active">
  <button onclick="goGPS()">WayFinder</button>
</div>

<!-- ===== GPS ===== -->
<div id="gps" class="screen">
  <h2 style="text-align:center;">Attiva posizione GPS</h2>
  <div style="text-align:center;">
    <button onclick="startApp()">Consenti GPS</button>
  </div>
</div>

<!-- ===== APP ===== -->
<div id="app" class="screen">

<div id="header">
  <img src="header-wayfinder.png">
</div>

<div id="info">
I punti di interesse mappati sono quelli presenti in un raggio di 1 km
</div>

<div id="filtri">
<label><input type="checkbox" value="borgo"> Borghi</label>
<label><input type="checkbox" value="nuraghe"> Nuraghi</label>
<label><input type="checkbox" value="domus"> Domus</label>
<label><input type="checkbox" value="tomba"> Tombe</label>
<label><input type="checkbox" value="fauna"> Fauna</label>
</div>

<div id="menuBtn" onclick="toggleMenu()">+</div>
<div id="menuPoi"></div>

<div id="map"></div>

<!-- RSS -->
<div id="rss">
<div class="marquee"><div>EVENTI E COMUNICAZIONI ISTITUZIONALI IN TEMPO REALE</div></div>
<div class="marquee"><div>📞 112 | INFOPOINT TERRITORIALE</div></div>
</div>

<div id="footer">
<b>PASSAMONTI</b>_COMMUNICATION
</div>

</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

const POI = [
{nome:"Bosa", lat:40.3, lon:8.5, cat:"borgo"},
{nome:"Su Nuraxi", lat:39.7, lon:9.0, cat:"nuraghe"},
{nome:"Anghelu Ruju", lat:40.6, lon:8.29, cat:"domus"}
];

let map, userLat, userLon;
let markers = [];

/* FLOW */
function goGPS(){
document.getElementById("start").classList.remove("active");
document.getElementById("gps").classList.add("active");
}

function startApp(){
navigator.geolocation.getCurrentPosition(pos=>{

userLat=pos.coords.latitude;
userLon=pos.coords.longitude;

document.getElementById("gps").classList.remove("active");
document.getElementById("app").classList.add("active");

initMap();
});
}

/* MAP */
function initMap(){
map=L.map('map',{dragging:false}).setView([40.1,9],8);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

L.circleMarker([userLat,userLon],{
radius:12,fillColor:"red",color:"white",weight:3,fillOpacity:1
}).addTo(map);
}

/* MENU */
function toggleMenu(){
let m=document.getElementById("menuPoi");
m.style.display = m.style.display==="none"?"block":"none";
}

</script>

</body>
</html>
