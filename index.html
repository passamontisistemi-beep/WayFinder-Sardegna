<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WayFinder Sardegna</title>

<link rel="stylesheet" href="style.css">

<!-- Leaflet -->
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

</head>

<body>

<!-- STEP 1 -->
<div id="step1" class="screen">

    <h2>Attiva GPS</h2>
    <button onclick="enableGPS()">Consenti posizione</button>

    <div id="radiusBox" style="display:none;">
        <p>Seleziona raggio (km)</p>
        <input type="range" min="1" max="100" value="10" id="radius">
        <span id="radiusValue">10 km</span>

        <h3>Seleziona POI</h3>

        <div class="checkboxes">
            <label><input type="checkbox" value="nuraghi"> Nuraghi</label>
            <label><input type="checkbox" value="domus"> Domus de Janas</label>
            <label><input type="checkbox" value="borghi"> Borghi</label>
            <label><input type="checkbox" value="pozzi"> Pozzi Sacri</label>
            <label><input type="checkbox" value="tombe"> Tombe dei Giganti</label>
            <label><input type="checkbox" value="flora"> Flora</label>
        </div>

        <button onclick="startApp()">Avvia</button>
    </div>
</div>

<!-- STEP 2 -->
<div id="mapScreen" class="hidden">

    <!-- HEADER -->
    <div class="header">
        <img src="header.png" alt="WayFinder Sardegna">
    </div>

    <p class="infoText">
        I PUNTI DI INTERESSE MAPPATI SONO QUELLI PRESENTI IN UN RAGGIO DI 
        <span id="raggioTxt"></span> KM
    </p>

    <div id="map"></div>

    <!-- Marker + -->
    <button id="markerBtn" onclick="toggleList()">+</button>

    <div id="poiList" class="hidden"></div>

    <!-- RSS -->
    <div class="rss">
        <div id="rssEvents"></div>
        <div id="rssContacts"></div>
    </div>

    <!-- LOGO -->
    <div class="logo">
        <b>PASSAMONTI</b>_COMMUNICATION
    </div>

</div>

<script src="app.js"></script>

</body>
</html>
