<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>WayFinder Sardegna</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
body { margin:0; font-family:Arial; }

/* SCHERMATE */
.screen {
  display:none;
  height:100vh;
  justify-content:center;
  align-items:center;
  flex-direction:column;
}
.active { display:flex; }

/* BOTTONI */
button {
  padding:18px 28px;
  font-size:18px;
  border:none;
  border-radius:12px;
  background:black;
  color:white;
  cursor:pointer;
}

button:active {
  transform:scale(0.95);
  background:#333;
}

/* FILTRI */
#filtri {
  display:flex;
  flex-direction:column;
  gap:12px;
  margin:20px;
}

/* ===== MAPPA ===== */

#app {
  display:none;
  flex-direction:column;
}

/* HEADER */
#header img {
  width:100%;
  height:80px;
  object-fit:cover;
}

/* INFO */
#info {
  text-align:center;
  font-weight:bold;
  padding:8px;
}

/* MAP */
#map {
  height:60vh;
}

/* MARKER + */
#menuBtn {
  position:absolute;
  top:120px;
  right:20px;
  width:70px;
  height:70px;
  border-radius:50%;
  background:red;
  color:white;
  font-size:30px;
  display:flex;
  justify-content:center;
  align-items:center;
  cursor:pointer;
  z-index:1000;
}

/* MENU */
#menuPoi {
  position:absolute;
  top:200px;
  right:20px;
  width:250px;
  background:white;
  display:none;
  border-radius:10px;
  padding:10px;
}
</style>
</head>

<body>

<!-- STEP 1 -->
<div id="start" class="screen active">
  <h2>WayFinder Sardegna</h2>
  <button onclick="vaiGPS()">Avvia</button>
</div>

<div id="gps" class="screen">
  <p>Consenti utilizzo GPS</p>
  <button onclick="attivaGPS()">Consenti</button>
</div>

<div id="filtriScreen" class="screen">
  <h3>Seleziona i POI</h3>

  <div id="filtri">
    <label><input type="checkbox" id="all"> Tutti</label>
    <label><input type="checkbox" value="nuraghe"> Nuraghi</label>
    <label><input type="checkbox" value="borgo"> Borghi</label>
    <label><input type="checkbox" value="domus"> Domus</label>
  </div>

  <button onclick="entraMappa()">Vai alla mappa</button>
</div>

<!-- STEP 2 MAPPA -->
<div id="app">

<div id="header">
  <img src="header-wayfinder.png">
</div>

<div id="info">
I punti di interesse mappati sono quelli presenti in un raggio di 1 km
</div>

<div id="menuBtn" onclick="toggleMenu()">+</div>

<div id="menuPoi">
  Menu POI (placeholder)
</div>

<div id="map"></div>

</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

// ===== NAV =====
function switchScreen(from,to){
  document.getElementById(from).classList.remove("active");
  document.getElementById(to).classList.add("active");
}

// STEP 1
function vaiGPS(){
  switchScreen("start","gps");
}

function attivaGPS(){
  navigator.geolocation.getCurrentPosition(
    (pos)=>{
      window.userLat = pos.coords.latitude;
      window.userLon = pos.coords.longitude;
      switchScreen("gps","filtriScreen");
    },
    ()=>alert("Attiva il GPS")
  );
}

// FILTRI
document.getElementById("all").addEventListener("change", function(){
  document.querySelectorAll("#filtri input").forEach(cb=>{
    if(cb.id !== "all") cb.checked = this.checked;
  });
});

// STEP 2
function entraMappa(){

  document.getElementById("filtriScreen").classList.remove("active");
  document.getElementById("app").style.display = "flex";

  // FIX LEAFLET (fondamentale)
  setTimeout(initMap,200);
}

// MAPPA
function initMap(){

  let map = L.map('map',{dragging:false}).setView([40.1,9],8);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

  // TU SEI QUI
  if(window.userLat){
    L.circleMarker([userLat,userLon],{
      radius:10,
      fillColor:"red",
      color:"white",
      weight:3
    }).addTo(map).bindPopup("Tu sei qui");
  }
}

// MENU +
function toggleMenu(){
  let m = document.getElementById("menuPoi");
  m.style.display = m.style.display==="none"?"block":"none";
}

</script>

</body>
</html>
