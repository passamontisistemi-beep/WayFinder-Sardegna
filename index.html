<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>WayFinder Sardegna</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
body { margin:0; font-family:Arial; }

/* SCHERMATE */
.screen {
  display:none;
  height:100vh;
  justify-content:center;
  align-items:center;
  flex-direction:column;
}
.active { display:flex; }

/* BOTTONI */
button {
  padding:18px 28px;
  font-size:18px;
  border:none;
  border-radius:12px;
  background:black;
  color:white;
  cursor:pointer;
}

button:active {
  transform:scale(0.95);
}

/* FILTRI */
#filtri {
  display:flex;
  flex-direction:column;
  gap:10px;
}

/* APP */
#app { display:none; flex-direction:column; }

/* HEADER */
#header img {
  width:100%;
  height:70px;
  object-fit:cover;
}

/* INFO */
#info {
  text-align:center;
  font-weight:bold;
  padding:8px;
}

/* MAP */
#map {
  height:55vh;
}

/* MARKER + */
#menuBtn {
  position:absolute;
  top:120px;
  right:20px;
  width:70px;
  height:70px;
  border-radius:50%;
  background:red;
  color:white;
  font-size:30px;
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:1000;
  cursor:pointer;
}

/* MENU */
#menuPoi {
  position:absolute;
  top:200px;
  right:20px;
  width:260px;
  max-height:300px;
  overflow:auto;
  background:white;
  display:none;
  border-radius:10px;
  padding:10px;
}

/* RSS */
#rss {
  background:black;
  color:white;
  font-weight:bold;
  font-size:13px;
}

.marquee {
  overflow:hidden;
  white-space:nowrap;
}

.marquee div {
  display:inline-block;
  padding-left:100%;
  animation:scroll 18s linear infinite;
}

@keyframes scroll {
  0% { transform:translateX(0); }
  100% { transform:translateX(-100%); }
}

/* FOOTER */
#footer {
  text-align:center;
  padding:10px;
}
</style>
</head>

<body>

<!-- START -->
<div id="start" class="screen active">
  <h2>WayFinder Sardegna</h2>
  <button onclick="vaiGPS()">Avvia</button>
</div>

<!-- GPS -->
<div id="gps" class="screen">
  <p>Consenti utilizzo GPS</p>
  <button onclick="attivaGPS()">Consenti</button>
</div>

<!-- FILTRI -->
<div id="filtriScreen" class="screen">
  <h3>Seleziona POI</h3>

  <div id="filtri">
    <label><input type="checkbox" id="all"> Tutti</label>
    <label><input type="checkbox" value="borgo"> Borghi</label>
    <label><input type="checkbox" value="nuraghe"> Nuraghi</label>
    <label><input type="checkbox" value="domus"> Domus</label>
    <label><input type="checkbox" value="tomba"> Tombe</label>
    <label><input type="checkbox" value="fauna"> Fauna</label>
  </div>

  <button onclick="entraMappa()">Vai alla mappa</button>
</div>

<!-- APP -->
<div id="app">

<div id="header">
  <img src="header-wayfinder.png">
</div>

<div id="info">
I punti di interesse mappati sono quelli presenti in un raggio di 10 km
</div>

<div id="menuBtn" onclick="toggleMenu()">+</div>
<div id="menuPoi"></div>

<div id="map"></div>

<div id="rss">
<div class="marquee"><div>EVENTI ISTITUZIONALI IN TEMPO REALE</div></div>
<div class="marquee"><div>📞 112 | INFOPOINT TERRITORIALE</div></div>
</div>

<div id="footer">
<b>PASSAMONTI</b>_COMMUNICATION
</div>

</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

// ===== POI REALI (ESEMPIO DAI TUOI EXCEL) =====
const POI = [
{nome:"Bosa", lat:40.3, lon:8.5, cat:"borgo"},
{nome:"Castelsardo", lat:40.92, lon:8.71, cat:"borgo"},
{nome:"Su Nuraxi", lat:39.7, lon:9.0, cat:"nuraghe"},
{nome:"Nuraghe Arrubiu", lat:39.66, lon:9.3, cat:"nuraghe"},
{nome:"Anghelu Ruju", lat:40.6, lon:8.29, cat:"domus"},
{nome:"Montessu", lat:39.11, lon:8.67, cat:"domus"},
{nome:"Coddu Vecchiu", lat:41.08, lon:9.38, cat:"tomba"},
{nome:"Fenicottero rosa", lat:39.22, lon:9.14, cat:"fauna"}
];

let map, userLat, userLon;
let markers = [];

// NAV
function switchScreen(from,to){
document.getElementById(from).classList.remove("active");
document.getElementById(to).classList.add("active");
}

function vaiGPS(){
switchScreen("start","gps");
}

function attivaGPS(){
navigator.geolocation.getCurrentPosition(pos=>{
userLat=pos.coords.latitude;
userLon=pos.coords.longitude;
switchScreen("gps","filtriScreen");
});
}

// FILTRI
document.getElementById("all").addEventListener("change", function(){
document.querySelectorAll("#filtri input").forEach(cb=>{
if(cb.id !== "all") cb.checked = this.checked;
});
});

// MAPPA
function entraMappa(){
document.getElementById("filtriScreen").classList.remove("active");
document.getElementById("app").style.display="flex";

setTimeout(initMap,200);
}

function initMap(){

map = L.map('map',{dragging:false}).setView([40.1,9],8);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

// posizione utente
L.circleMarker([userLat,userLon],{
radius:12,fillColor:"red",color:"white",weight:3
}).addTo(map).bindPopup("Tu sei qui");

// carica POI
caricaPOI();
}

// DISTANZA
function distanza(a,b,c,d){
let R=6371;
let dLat=(c-a)*Math.PI/180;
let dLon=(d-b)*Math.PI/180;
let x=Math.sin(dLat/2)**2+
Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(dLon/2)**2;
return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}

// CARICA POI
function caricaPOI(){

markers.forEach(m=>map.removeLayer(m));
markers=[];

let menu=document.getElementById("menuPoi");
menu.innerHTML="";

POI.forEach(p=>{

if(distanza(userLat,userLon,p.lat,p.lon)<=10){

let m=L.circleMarker([p.lat,p.lon],{
radius:6,fillColor:"blue",color:"blue"
}).addTo(map);

markers.push(m);

// menu
let div=document.createElement("div");
div.innerText=p.nome;
div.style.padding="8px";
div.onclick=()=>map.setView([p.lat,p.lon],14);
menu.appendChild(div);

}
});
}

// MENU +
function toggleMenu(){
let m=document.getElementById("menuPoi");
m.style.display = m.style.display==="none"?"block":"none";
}

</script>

</body>
</html>
