<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>WayFinder Sardegna</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
body { margin:0; font-family: Arial; }

/* HEADER */
.header img {
    width:100%;
    display:block;
}

/* TESTO */
.infoText {
    text-align:center;
    font-size:14px;
    font-weight:bold;
    padding:5px;
}

/* MAP */
#map {
    height:calc(100vh - 180px);
}

/* BUTTON */
#markerBtn {
    position:absolute;
    right:15px;
    top:140px;
    width:55px;
    height:55px;
    border-radius:50%;
    background:red;
    color:white;
    font-size:26px;
    z-index:999;
    animation:pulse 1.5s infinite;
}

@keyframes pulse {
    0% { box-shadow:0 0 0 0 rgba(255,0,0,0.7); }
    70% { box-shadow:0 0 0 20px rgba(255,0,0,0); }
    100% { box-shadow:0 0 0 0 rgba(255,0,0,0); }
}

/* MENU */
#poiMenu {
    position:absolute;
    right:10px;
    top:210px;
    width:250px;
    max-height:40vh;
    overflow:auto;
    background:white;
    display:none;
    z-index:999;
    border-radius:10px;
    padding:10px;
}

/* POI */
.dot {
    width:28px;
    height:28px;
    border-radius:50%;
}

.nuraghi { background:brown; }
.domus { background:purple; }
.borghi { background:orange; }
.pozzi { background:green; }
.tombe { background:black; }
.flora { background:darkgreen; }
.user { background:blue; }

/* FOOTER */
.footer {
    position:fixed;
    bottom:0;
    width:100%;
}

.rss {
    background:#000;
    color:#fff;
    overflow:hidden;
    font-size:13px;
}

.rss-track {
    white-space:nowrap;
    animation:scroll 40s linear infinite;
    padding:4px;
}

@keyframes scroll {
    0% { transform:translateX(100%); }
    100% { transform:translateX(-100%); }
}

.logo {
    text-align:center;
    background:#000;
    color:#fff;
    font-size:12px;
    padding:5px;
}

/* POPUP */
.overlay {
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.7);
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:2000;
}

.popup {
    background:white;
    padding:20px;
    border-radius:10px;
    text-align:center;
}

.hidden { display:none; }

</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
<img src="header-wayfinder.png">
</div>

<div class="infoText">
I PUNTI DI INTERESSE MAPPATI SONO QUELLI PRESENTI IN UN RAGGIO DI <span id="raggioTxt">--</span> KM
</div>

<button id="markerBtn" onclick="toggleMenu()">+</button>
<div id="poiMenu"></div>

<div id="map"></div>

<!-- FOOTER -->
<div class="footer">
<div class="rss"><div class="rss-track" id="rssEvents"></div></div>
<div class="rss"><div class="rss-track" id="rssContacts"></div></div>
<div class="logo"><b>PASSAMONTI</b>_COMMUNICATION</div>
</div>

<!-- POPUP GPS -->
<div id="gpsPopup" class="overlay">
<div class="popup">
<h3>Consenti accesso GPS</h3>
<button onclick="enableGPS()">Consenti</button>
</div>
</div>

<!-- POPUP RAGGIO -->
<div id="radiusPopup" class="overlay hidden">
<div class="popup">
<p>Seleziona raggio (0-200 km)</p>
<input type="range" min="1" max="200" value="50" id="radius">
<p><span id="radiusValue">50</span> km</p>
<button onclick="startApp()">Avvia</button>
</div>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

let map;
let userLat, userLon;
let radiusKm = 50;
let markers = [];

let poiData = [ /* già inseriti prima */ ];

let events = [
"Mostre culturali Sardegna ✦ Festival locali ✦ Eventi archeologici"
];

/* SLIDER */
document.getElementById("radius").oninput = function(){
document.getElementById("radiusValue").innerText=this.value;
}

/* GPS */
function enableGPS(){
navigator.geolocation.getCurrentPosition(pos=>{
userLat=pos.coords.latitude;
userLon=pos.coords.longitude;

document.getElementById("gpsPopup").classList.add("hidden");
document.getElementById("radiusPopup").classList.remove("hidden");
});
}

/* START */
function startApp(){

radiusKm=document.getElementById("radius").value;
document.getElementById("raggioTxt").innerText=radiusKm;

document.getElementById("radiusPopup").classList.add("hidden");

initMap();
loadPOI();
loadEvents();
}

/* MAP */
function initMap(){
map=L.map('map',{minZoom:7,maxBounds:[[38.5,8],[41.5,10]]})
.setView([userLat,userLon],10);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

createDot(userLat,userLon,"user","TU SEI QUI");
}

/* DOT */
function createDot(lat,lon,type,label){

let div=document.createElement("div");
div.className="dot "+type;

let icon=L.divIcon({html:div,iconSize:[28,28],className:''});

let m=L.marker([lat,lon],{icon}).addTo(map).bindPopup(label);
markers.push(m);

return m;
}

/* POI */
function loadPOI(){

poiData.forEach(poi=>{

let d=distance(userLat,userLon,poi.lat,poi.lon);

if(d<=radiusKm){

let wiki="https://it.wikipedia.org/wiki/"+encodeURIComponent(poi.name);
let maps=`https://www.google.com/maps/dir/?api=1&destination=${poi.lat},${poi.lon}`;

let popup=`<b>${poi.name}</b><br>
<a href="${wiki}" target="_blank">Wikipedia</a><br>
<a href="${maps}" target="_blank">Come arrivare</a>`;

let m=createDot(poi.lat,poi.lon,poi.category,popup);

let item=document.createElement("div");
item.innerText=poi.name;

item.onclick=()=>{
map.setView([poi.lat,poi.lon],13);
m.openPopup();
};

document.getElementById("poiMenu").appendChild(item);
}
});

}

/* MENU */
function toggleMenu(){
let m=document.getElementById("poiMenu");
m.style.display=m.style.display==="block"?"none":"block";
}

/* EVENTS */
function loadEvents(){
document.getElementById("rssEvents").innerText=events.join(" ✦ ");
document.getElementById("rssContacts").innerText="📞 112 ✦ 📞 118 ✦ 📞 INFOPOINT";
}

/* DIST */
function distance(a,b,c,d){
let R=6371;
let dLat=(c-a)*Math.PI/180;
let dLon=(d-b)*Math.PI/180;
let x=Math.sin(dLat/2)**2+
Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*
Math.sin(dLon/2)**2;
return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}

</script>

</body>
</html>
