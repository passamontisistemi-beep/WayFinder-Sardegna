<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>WayFinder Sardegna - Step 1</title>

<style>
body { margin:0; font-family:Arial; }

/* SCHERMATE */
.screen {
  display:none;
  height:100vh;
  justify-content:center;
  align-items:center;
  flex-direction:column;
}
.active { display:flex; }

/* BOTTONI */
button {
  padding:15px 25px;
  font-size:18px;
  border:none;
  border-radius:10px;
  background:black;
  color:white;
}

/* FILTRI */
#filtri {
  display:flex;
  flex-direction:column;
  gap:10px;
  margin:20px;
}

label {
  font-size:16px;
}
</style>
</head>

<body>

<!-- SCREEN 1 -->
<div id="start" class="screen active">
  <h2>WayFinder Sardegna</h2>
  <button onclick="vaiGPS()">Avvia</button>
</div>

<!-- SCREEN 2 -->
<div id="gps" class="screen">
  <p>Consenti l'utilizzo del GPS</p>
  <button onclick="attivaGPS()">Consenti</button>
</div>

<!-- SCREEN 3 -->
<div id="filtriScreen" class="screen">
  <h3>Seleziona i punti di interesse</h3>

  <div id="filtri">
    <label><input type="checkbox" id="all"> Tutti</label>
    <label><input type="checkbox" value="nuraghe"> Nuraghi</label>
    <label><input type="checkbox" value="borgo"> Borghi</label>
    <label><input type="checkbox" value="domus"> Domus de Janas</label>
    <label><input type="checkbox" value="pozzi"> Pozzi Sacri</label>
    <label><input type="checkbox" value="tombe"> Tombe dei Giganti</label>
    <label><input type="checkbox" value="fauna"> Flora / Fauna</label>
  </div>

  <button onclick="confermaSelezione()">Conferma</button>
</div>

<script>

// ===== NAVIGAZIONE =====
function switchScreen(from, to){
  document.getElementById(from).classList.remove("active");
  document.getElementById(to).classList.add("active");
}

// STEP 1 → STEP 2
function vaiGPS(){
  switchScreen("start","gps");
}

// GPS
function attivaGPS(){

  navigator.geolocation.getCurrentPosition(
    (pos)=>{
      // salviamo posizione
      window.userLat = pos.coords.latitude;
      window.userLon = pos.coords.longitude;

      switchScreen("gps","filtriScreen");
    },
    ()=>{
      alert("Devi autorizzare il GPS per continuare");
    }
  );
}

// FILTRI LOGICA "TUTTI"
document.getElementById("all").addEventListener("change", function(){
  let checked = this.checked;

  document.querySelectorAll("#filtri input").forEach(cb=>{
    if(cb.id !== "all"){
      cb.checked = checked;
    }
  });
});

// CONFERMA (per ora solo test)
function confermaSelezione(){

  let selezionati = [...document.querySelectorAll("#filtri input:checked")]
    .map(x=>x.value)
    .filter(v=>v);

  if(selezionati.length === 0){
    alert("Seleziona almeno un tipo di POI");
    return;
  }

  console.log("POI selezionati:", selezionati);

  alert("STEP 1 OK - pronto per la mappa");
}

</script>

</body>
</html>
