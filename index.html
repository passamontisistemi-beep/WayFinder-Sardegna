<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WayFinder Sardegna</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
body { margin:0; font-family: Arial; background:#f4f4f4; }

/* STEP 1 */
#step1 { text-align:center; padding:20px; }

/* HEADER */
.header img { width:100%; }

/* MAP */
#map { height:60vh; }

/* INFO */
.infoText { text-align:center; font-weight:bold; }

/* PULSANTE + */
#markerBtn {
    position:fixed;
    top:80px;
    right:15px;
    width:55px;
    height:55px;
    border-radius:50%;
    font-size:28px;
    background:red;
    color:white;
    z-index:999;
}

/* MENU TENDINA */
#poiMenu {
    position:fixed;
    top:140px;
    right:15px;
    width:250px;
    max-height:50vh;
    overflow:auto;
    background:white;
    display:none;
    z-index:999;
    border-radius:10px;
    padding:10px;
}

/* RSS */
.rss {
    position:fixed;
    bottom:40px;
    width:100%;
    background:#ddd;
    padding:5px;
    font-size:14px;
}

/* LOGO */
.logo {
    position:fixed;
    bottom:0;
    width:100%;
    text-align:center;
    font-size:12px;
}

/* PALLINI */
.dot {
    width:14px;
    height:14px;
    border-radius:50%;
}

/* COLORI CATEGORIE */
.nuraghi { background:brown; }
.domus { background:purple; }
.borghi { background:orange; }
.pozzi { background:green; }
.tombe { background:black; }
.flora { background:darkgreen; }
.user { background:blue; }

.hidden { display:none; }
</style>
</head>

<body>

<!-- STEP 1 -->
<div id="step1">
<h2>Attiva GPS</h2>
<button onclick="enableGPS()">Consenti posizione</button>

<div id="stepOptions" style="display:none;">
<p>Seleziona raggio (km)</p>
<input type="range" min="1" max="100" value="10" id="radius">
<span id="radiusValue">10 km</span>

<h3>Seleziona POI</h3>
<label><input type="checkbox" value="borghi"> Borghi</label>
<label><input type="checkbox" value="nuraghi"> Nuraghi</label>
<label><input type="checkbox" value="domus"> Domus</label>
<label><input type="checkbox" value="pozzi"> Pozzi</label>
<label><input type="checkbox" value="tombe"> Tombe</label>
<label><input type="checkbox" value="flora"> Flora</label>

<br><br>
<button onclick="startApp()">AVVIA</button>
</div>
</div>

<!-- STEP 2 -->
<div id="mapScreen" class="hidden">

<div class="header">
<img src="header-wayfinder.png">
</div>

<p class="infoText">
I POI SONO ENTRO <span id="raggioTxt"></span> KM
</p>

<div id="map"></div>

<button id="markerBtn" onclick="toggleMenu()">+</button>
<div id="poiMenu"></div>

<div class="rss">
<div>EVENTI: nessun dato</div>
<div>📞 112 | 📞 1500</div>
</div>

<div class="logo">
<b>PASSAMONTI</b>_COMMUNICATION
</div>

</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

let userLat, userLon;
let map;
let radiusKm = 10;
let selectedCategories = [];
let markers = [];

// 🔥 DATI COMPLETI (ESEMPIO ESTESO)
let poiData = [
{ name:"Nuraghe Arrubiu", category:"nuraghi", lat:39.49, lon:9.20 },
{ name:"Domus Su Mont'e s'Abe", category:"domus", lat:40.56, lon:8.31 },
{ name:"Pozzo Sacro Santa Cristina", category:"pozzi", lat:40.02, lon:8.75 },
{ name:"Tomba dei Giganti Coddu Vecchiu", category:"tombe", lat:41.05, lon:9.33 },
{ name:"Foresta Montes", category:"flora", lat:40.17, lon:9.35 },
{ name:"Bosa", category:"borghi", lat:40.3, lon:8.5 }
];

// UI
document.getElementById("radius").oninput = function(){
    document.getElementById("radiusValue").innerText = this.value + " km";
}

// GPS
function enableGPS(){
    navigator.geolocation.getCurrentPosition(pos=>{
        userLat = pos.coords.latitude;
        userLon = pos.coords.longitude;
        document.getElementById("stepOptions").style.display="block";
    });
}

// START
function startApp(){

    radiusKm = document.getElementById("radius").value;

    document.querySelectorAll("input:checked").forEach(el=>{
        selectedCategories.push(el.value);
    });

    document.getElementById("step1").classList.add("hidden");
    document.getElementById("mapScreen").classList.remove("hidden");

    document.getElementById("raggioTxt").innerText = radiusKm;

    initMap();
    loadPOI();

    setInterval(refreshPosition, 300000);
}

// MAP
function initMap(){

    map = L.map('map',{
        minZoom:7,
        maxBounds:[[38.5,8],[41.5,10]]
    }).setView([userLat,userLon],10);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

    createDot(userLat,userLon,"user","TU SEI QUI");
}

// CREAZIONE PALLINI
function createDot(lat,lon,type,label){

    let div = document.createElement("div");
    div.className = "dot " + type;

    let icon = L.divIcon({
        html: div,
        iconSize:[14,14]
    });

    let marker = L.marker([lat,lon],{icon}).addTo(map).bindPopup(label);

    markers.push(marker);

    return marker;
}

// POI
function loadPOI(){

    markers.forEach(m=>map.removeLayer(m));
    markers = [];

    document.getElementById("poiMenu").innerHTML="";

    poiData.forEach(poi=>{

        if(!selectedCategories.includes(poi.category)) return;

        let d = distance(userLat,userLon,poi.lat,poi.lon);

        if(d <= radiusKm){

            let m = createDot(poi.lat,poi.lon,poi.category,poi.name);

            // MENU
            let item = document.createElement("div");
            item.innerText = poi.name;

            item.onclick = ()=>{
                map.setView([poi.lat,poi.lon],13);
                m.openPopup();
            };

            document.getElementById("poiMenu").appendChild(item);
        }
    });

    createDot(userLat,userLon,"user","TU SEI QUI");
}

// MENU
function toggleMenu(){
    let m = document.getElementById("poiMenu");
    m.style.display = m.style.display==="block"?"none":"block";
}

// REFRESH
function refreshPosition(){
    navigator.geolocation.getCurrentPosition(pos=>{
        userLat = pos.coords.latitude;
        userLon = pos.coords.longitude;
        map.setView([userLat,userLon]);
        loadPOI();
    });
}

// DISTANZA
function distance(a,b,c,d){
    let R=6371;
    let dLat=(c-a)*Math.PI/180;
    let dLon=(d-b)*Math.PI/180;

    let x=Math.sin(dLat/2)**2+
    Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*
    Math.sin(dLon/2)**2;

    return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}

</script>

</body>
</html>
