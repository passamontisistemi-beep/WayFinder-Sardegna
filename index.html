<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>WayFinder Sardegna</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
body { margin:0; font-family: Arial; }

.header { text-align:center; font-weight:bold; padding:10px; }

.infoText { text-align:center; font-size:14px; font-weight:bold; }

#map { height:60vh; }

#markerBtn {
    position:absolute;
    right:15px;
    top:110px;
    width:60px;
    height:60px;
    border-radius:50%;
    background:red;
    color:white;
    font-size:28px;
    z-index:999;
    animation:pulse 1.5s infinite;
}

@keyframes pulse {
    0% { box-shadow:0 0 0 0 rgba(255,0,0,0.7); }
    70% { box-shadow:0 0 0 20px rgba(255,0,0,0); }
    100% { box-shadow:0 0 0 0 rgba(255,0,0,0); }
}

#poiMenu {
    position:absolute;
    right:10px;
    top:180px;
    width:250px;
    max-height:40vh;
    overflow:auto;
    background:white;
    display:none;
    z-index:999;
    border-radius:10px;
    padding:10px;
}

.dot {
    width:36px;
    height:36px;
    border-radius:50%;
}

.nuraghi { background:brown; }
.domus { background:purple; }
.borghi { background:orange; }
.pozzi { background:green; }
.tombe { background:black; }
.flora { background:darkgreen; }
.user { background:blue; }

.footer {
    position:fixed;
    bottom:0;
    width:100%;
}

.rss {
    background:#000;
    color:#fff;
    overflow:hidden;
    font-size:13px;
}

.rss-track {
    white-space:nowrap;
    animation:scroll 40s linear infinite;
    padding:4px;
}

@keyframes scroll {
    0% { transform:translateX(100%); }
    100% { transform:translateX(-100%); }
}

.logo {
    text-align:center;
    background:#000;
    color:#fff;
    font-size:12px;
    padding:5px;
}

</style>
</head>

<body>

<div class="header">WAYFINDER SARDEGNA</div>

<div class="infoText">
I PUNTI DI INTERESSE MAPPATI SONO QUELLI PRESENTI IN UN RAGGIO DI 100 KM
</div>

<button id="markerBtn" onclick="toggleMenu()">+</button>
<div id="poiMenu"></div>

<div id="map"></div>

<div class="footer">
<div class="rss"><div class="rss-track" id="rssEvents"></div></div>
<div class="rss"><div class="rss-track" id="rssContacts"></div></div>
<div class="logo"><b>PASSAMONTI</b>_COMMUNICATION</div>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

let map = L.map('map',{minZoom:7,maxBounds:[[38.5,8],[41.5,10]]})
.setView([40.0,9.0],8);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

function createDot(poi){
let div=document.createElement("div");
div.className="dot "+poi.category;

let icon=L.divIcon({html:div,iconSize:[36,36],className:''});

let wiki="https://it.wikipedia.org/wiki/"+encodeURIComponent(poi.name);
let maps=`https://www.google.com/maps/dir/?api=1&destination=${poi.lat},${poi.lon}`;

return L.marker([poi.lat,poi.lon],{icon})
.addTo(map)
.bindPopup(`<b>${poi.name}</b><br>
<a href="${wiki}" target="_blank">Wikipedia</a><br>
<a href="${maps}" target="_blank">Come arrivare</a>`);
}

/* 🔥 TUTTI I TUOI POI REALI */
let poiData = [
{ name:"Lollove",category:"borghi",lat:40.365,lon:9.3324},
{ name:"Tempio Pausania",category:"borghi",lat:40.9,lon:9.1},
{ name:"Aggius",category:"borghi",lat:40.93,lon:8.98},
{ name:"Atzara",category:"borghi",lat:39.99,lon:9.07},
{ name:"Bosa",category:"borghi",lat:40.3,lon:8.5},
{ name:"Carloforte",category:"borghi",lat:39.14,lon:8.3},
{ name:"Galtellì",category:"borghi",lat:40.39,lon:9.61},
{ name:"Laconi",category:"borghi",lat:39.85,lon:9.05},
{ name:"La Maddalena",category:"borghi",lat:41.21,lon:9.41},
{ name:"Oliena",category:"borghi",lat:40.27,lon:9.4},
{ name:"Posada",category:"borghi",lat:40.63,lon:9.72},
{ name:"Sadali",category:"borghi",lat:39.82,lon:9.27},
{ name:"Sardara",category:"borghi",lat:39.62,lon:8.82},
{ name:"Gavoi",category:"borghi",lat:40.16,lon:9.2},
{ name:"Castelsardo",category:"borghi",lat:40.92,lon:8.71},

{ name:"Nuraghe Arrubiu",category:"nuraghi",lat:39.66,lon:9.3},
{ name:"Su Nuraxi",category:"nuraghi",lat:39.7,lon:9.0},
{ name:"Nuraghe Losa",category:"nuraghi",lat:40.128,lon:8.82},

{ name:"Coddu Vecchiu",category:"tombe",lat:41.08,lon:9.38},
{ name:"Li Lolghi",category:"tombe",lat:41.07,lon:9.37},

{ name:"Anghelu Ruju",category:"domus",lat:40.6,lon:8.29},
{ name:"Sant’Andrea Priu",category:"domus",lat:40.43,lon:8.77},

{ name:"Fenicottero rosa",category:"flora",lat:39.22,lon:9.14},
{ name:"Cervo sardo",category:"flora",lat:39.18,lon:8.93}
];

/* LOAD */
poiData.forEach(poi=>{
let m=createDot(poi);

let item=document.createElement("div");
item.innerText=poi.name;

item.onclick=()=>{
map.setView([poi.lat,poi.lon],13);
m.openPopup();
};

document.getElementById("poiMenu").appendChild(item);
});

/* MENU */
function toggleMenu(){
let m=document.getElementById("poiMenu");
m.style.display=m.style.display==="block"?"none":"block";
}

/* RSS */
document.getElementById("rssEvents").innerText =
"Mostre ed eventi culturali in Sardegna ✦ Festival locali ✦ Eventi archeologici";

document.getElementById("rssContacts").innerText =
"📞 112 ✦ 📞 118 ✦ 📞 1515 ✦ 📞 INFOPOINT";

</script>

</body>
</html>
