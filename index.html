<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>WayFinder Sardegna</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
body { margin:0; font-family: Arial; }

/* MAP */
#map { height:75vh; }

/* BUTTON */
#markerBtn {
    position:fixed;
    top:160px;
    right:15px;
    width:70px;
    height:70px;
    border-radius:50%;
    background:red;
    color:white;
    font-size:32px;
    z-index:999;
    animation:pulse 1.8s infinite;
}

@keyframes pulse {
    0% { box-shadow:0 0 0 0 rgba(255,0,0,0.7); }
    70% { box-shadow:0 0 0 25px rgba(255,0,0,0); }
    100% { box-shadow:0 0 0 0 rgba(255,0,0,0); }
}

/* MENU */
#poiMenu {
    position:fixed;
    top:250px;
    right:15px;
    width:260px;
    max-height:50vh;
    overflow:auto;
    background:white;
    display:none;
    z-index:999;
    border-radius:10px;
    padding:10px;
}

/* RSS */
.rss {
    position:fixed;
    bottom:0;
    width:100%;
    background:#000;
    color:#fff;
    overflow:hidden;
}

.rss-track {
    white-space:nowrap;
    animation:scroll 45s linear infinite;
    padding:6px;
}

@keyframes scroll {
    0% { transform:translateX(100%); }
    100% { transform:translateX(-100%); }
}

/* LOGO */
.logo {
    position:fixed;
    bottom:30px;
    width:100%;
    text-align:center;
    font-size:10px;
}

/* POI GRANDI */
.dot {
    width:34px;
    height:34px;
    border-radius:50%;
}

/* COLORI */
.nuraghi { background:brown; }
.domus { background:purple; }
.borghi { background:orange; }
.pozzi { background:green; }
.tombe { background:black; }
.flora { background:darkgreen; }
.user { background:blue; }

</style>
</head>

<body>

<div id="map"></div>

<button id="markerBtn" onclick="toggleMenu()">+</button>
<div id="poiMenu"></div>

<div class="rss">
<div class="rss-track" id="rssEvents"></div>
</div>

<div class="logo">
<b>PASSAMONTI</b>_COMMUNICATION
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

let map;
let userLat, userLon;
let poiData = [];
let events = [];
let markers = [];
let radiusKm = 200;

/* ===========================
   🔥 INCOLLA QUI IL CSV POI
   =========================== */

let csvPOI = `
NOME,CATEGORIA,LAT,LON
Nuraghe Arrubiu,nuraghi,39.49,9.20
Bosa,borghi,40.3,8.5
`;

/* ===========================
   🔥 INCOLLA QUI EVENTI
   =========================== */

let csvEVENTI = `
TITOLO,LUOGO,DATA
Mostra archeologica,Cagliari,12 Luglio
Festival cultura,Nuoro,20 Luglio
`;

/* ===========================
   PARSER CSV
   =========================== */

function parseCSV(csv){

    let rows = csv.trim().split("\n");
    let headers = rows[0].split(",");

    return rows.slice(1).map(row=>{
        let values = row.split(",");
        let obj = {};

        headers.forEach((h,i)=>{
            obj[h.trim().toLowerCase()] = values[i].trim();
        });

        return obj;
    });
}

/* LOAD DATA */
function loadData(){

    let poiRaw = parseCSV(csvPOI);

    poiData = poiRaw.map(p=>({
        name:p.nome,
        category:p.categoria,
        lat:parseFloat(p.lat),
        lon:parseFloat(p.lon)
    }));

    let evRaw = parseCSV(csvEVENTI);

    events = evRaw.map(e=>({
        titolo:e.titolo,
        luogo:e.luogo,
        data:e.data
    }));

    startApp();
}

/* START */
function startApp(){

navigator.geolocation.getCurrentPosition(pos=>{
userLat=pos.coords.latitude;
userLon=pos.coords.longitude;

initMap();
loadPOI();
loadEvents();

setInterval(refreshPosition,300000);
});
}

/* MAP */
function initMap(){
map=L.map('map',{minZoom:7,maxBounds:[[38.5,8],[41.5,10]]})
.setView([userLat,userLon],10);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

createDot(userLat,userLon,"user","TU SEI QUI");
}

/* DOT */
function createDot(lat,lon,type,label){

let div=document.createElement("div");
div.className="dot "+type;

let icon=L.divIcon({
html:div,
iconSize:[34,34],
className:''
});

let m=L.marker([lat,lon],{icon}).addTo(map).bindPopup(label);
markers.push(m);

return m;
}

/* POI */
function loadPOI(){

markers.forEach(m=>map.removeLayer(m));
markers=[];

document.getElementById("poiMenu").innerHTML="";

poiData.forEach(poi=>{

let d=distance(userLat,userLon,poi.lat,poi.lon);

if(d<=radiusKm){

let m=createDot(poi.lat,poi.lon,poi.category,poi.name);

let item=document.createElement("div");
item.innerText=poi.name;

item.onclick=()=>{
map.setView([poi.lat,poi.lon],13);
m.openPopup();
};

document.getElementById("poiMenu").appendChild(item);
}
});

createDot(userLat,userLon,"user","TU SEI QUI");
}

/* MENU */
function toggleMenu(){
let m=document.getElementById("poiMenu");
m.style.display=m.style.display==="block"?"none":"block";
}

/* EVENTS */
function loadEvents(){
document.getElementById("rssEvents").innerText =
events.map(e=>`${e.titolo} - ${e.luogo} (${e.data})`).join(" ✦ ");
}

/* REFRESH */
function refreshPosition(){
navigator.geolocation.getCurrentPosition(pos=>{
userLat=pos.coords.latitude;
userLon=pos.coords.longitude;
map.setView([userLat,userLon]);
loadPOI();
});
}

/* DISTANCE */
function distance(a,b,c,d){
let R=6371;
let dLat=(c-a)*Math.PI/180;
let dLon=(d-b)*Math.PI/180;

let x=Math.sin(dLat/2)**2+
Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*
Math.sin(dLon/2)**2;

return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}

loadData();

</script>

</body>
</html>
